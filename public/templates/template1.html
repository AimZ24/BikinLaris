<!-- Template 1: Modern Minimalist Poster -->
<div style="
  background: linear-gradient(135deg, #ffffff 0%, #f8f9ff 100%);
  width: 800px;
  height: 1200px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 40px;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  box-sizing: border-box;
">
  <img src="" style="
    width: 80%;
    max-height: 50%;
    object-fit: contain;
    margin-bottom: 30px;
    filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.1));
  " alt="Product" />
  
  <h1 style="
    font-size: 48px;
    font-weight: 700;
    color: #1a1a1a;
    margin: 20px 0 15px 0;
    line-height: 1.1;
    text-align: center;
  ">{{headline}}</h1>
  
  <p style="
    font-size: 24px;
    color: #666;
    font-weight: 400;
    margin-bottom: 20px;
    text-align: center;
  ">{{subheadline}}</p>
  
  <div style="
    font-size: 40px;
    font-weight: 700;
    color: #0066ff;
    margin: 10px 0;
    background: linear-gradient(135deg, #0066ff, #0052cc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  ">{{price}}</div>
  
  <div style="
    background: linear-gradient(135deg, #0066ff 0%, #0052cc 100%);
    color: white;
    padding: 15px 40px;
    font-size: 18px;
    font-weight: 600;
    border-radius: 50px;
    margin-top: 20px;
    text-align: center;
  ">Order Now via WhatsApp</div>
</div>
