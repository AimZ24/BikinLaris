<!-- Template 3: Vibrant Pop Poster -->
<div style="
  background: linear-gradient(135deg, #ff4757 0%, #ff6348 100%);
  width: 800px;
  height: 1200px;
  padding: 20px;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
">
  <div style="
    background: white;
    padding: 40px;
    height: 95%;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
  ">
    <img src="" style="
      width: 100%;
      max-height: 40%;
      object-fit: contain;
      margin-bottom: 30px;
    " alt="Product" />
    
    <h1 style="
      color: #ff4757;
      font-size: 56px;
      text-transform: uppercase;
      font-weight: 700;
      margin: 20px 0;
      text-align: center;
      line-height: 1.1;
    ">{{headline}}</h1>
    
    <p style="
      color: #2f3542;
      font-size: 24px;
      margin: 0 0 30px 0;
      text-align: center;
    ">{{subheadline}}</p>
    
    <div style="
      color: #2f3542;
      font-weight: 700;
      font-size: 48px;
      margin: 30px 0;
      padding: 20px;
      background: linear-gradient(135deg, #ffeeaa 0%, #ffd700 100%);
      border-radius: 15px;
      width: 100%;
      text-align: center;
    ">{{price}}</div>
    
    <div style="
      background: linear-gradient(135deg, #ff4757 0%, #ff6348 100%);
      color: white;
      padding: 18px 40px;
      font-size: 20px;
      font-weight: 700;
      border-radius: 50px;
      text-align: center;
      margin-top: auto;
    ">🛍️ PESAN SEKARANG!</div>
  </div>
</div>
